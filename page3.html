<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You’re Perfect</title>
<style>
  body {
    background: radial-gradient(circle at top, #ffb6c1, #ff69b4);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: 'Comic Sans MS', cursive;
    color: white;
    text-align: center;
  }
  h1 {
    font-size: 3em;
    animation: glow 2s ease-in-out infinite alternate;
  }
  p {
    font-size: 1.5em;
    margin-top: 10px;
  }
  .heart {
    position: absolute;
    width: 20px;
    height: 20px;
    background: red;
    transform: rotate(-45deg);
    animation: floatUp 5s linear infinite;
  }
  .heart::before,
  .heart::after {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    background: red;
    border-radius: 50%;
  }
  .heart::before { top: -10px; left: 0; }
  .heart::after { left: 10px; top: 0; }

  @keyframes glow {
    0% { text-shadow: 0 0 10px #fff, 0 0 20px #ff66cc; }
    100% { text-shadow: 0 0 20px #fff, 0 0 40px #ff1493; }
  }
  @keyframes floatUp {
    0% { transform: translateY(400px) rotate(-45deg); opacity: 1; }
    100% { transform: translateY(-100px) rotate(-45deg); opacity: 0; }
  }
</style>
</head>
<body>
  <h1>You’re Absolutely Perfect 💕</h1>
  <p>Never forget how special you are.</p>
  <a href="index.html" style="text-decoration:none; color:white; margin-top:25px;">⬅ Back to Start</a>

  <script>
    for (let i = 0; i < 25; i++) {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.style.left = Math.random() * 100 + '%';
      heart.style.animationDelay = Math.random() * 3 + 's';
      document.body.appendChild(heart);
    }
  </script>
</body>
</html>
