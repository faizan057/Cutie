<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Beauty</title>
<style>
  body {
    background: linear-gradient(135deg, #ffecd2, #fcb69f);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #fff;
    font-family: 'Comic Sans MS', cursive;
    text-align: center;
  }
  h1 {
    font-size: 2.8em;
    color: #ff1493;
    text-shadow: 2px 2px 8px #ff69b4;
    animation: bounce 2s infinite;
  }
  p {
    font-size: 1.4em;
    color: #fff;
    margin-top: 10px;
  }
  .sparkle {
    position: absolute;
    width: 10px;
    height: 10px;
    background: white;
    border-radius: 50%;
    animation: sparkle 3s linear infinite;
  }
  @keyframes sparkle {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-600px) scale(0.2); opacity: 0; }
  }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }
  a {
    margin-top: 30px;
    text-decoration: none;
    color: #fff;
    background: #ff69b4;
    padding: 12px 25px;
    border-radius: 25px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }
</style>
</head>
<body>
  <h1>You Shine Like The Stars ✨</h1>
  <p>Every smile of yours makes the world a little brighter.</p>
  <a href="page3.html">Next ➜</a>

  <script>
    for (let i = 0; i < 30; i++) {
      const sparkle = document.createElement('div');
      sparkle.classList.add('sparkle');
      sparkle.style.left = Math.random() * 100 + '%';
      sparkle.style.top = Math.random() * 100 + '%';
      sparkle.style.animationDelay = Math.random() * 3 + 's';
      document.body.appendChild(sparkle);
    }
  </script>
</body>
</html>
